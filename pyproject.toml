[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-schema-replay"
version = "0.1.0"
description = "Offline replay of synthetic MCP tool arguments against old and new JSON Schemas"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
tool-schema-replay = "tool_schema_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
